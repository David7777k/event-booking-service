spring:
  application:
    name: seatflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatflow}
    username: ${DB_USER:seatflow}
    password: ${DB_PASSWORD:seatflow}

  jpa:
    # Flyway owns the schema. Hibernate only checks that its mapping agrees
    # with what the migrations produced, and refuses to start if it does not.
    hibernate:
      ddl-auto: validate
    # Off by default here: leaving it on keeps a connection and a session open
    # for the whole request, which hides N+1 queries behind the view layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Hard ceiling on page size. Without it a client can pass ?size=100000
        # and turn a paginated endpoint back into a full table scan.
        max-page-size: 100
        default-page-size: 20
        # Serialise pages through an explicit DTO. Writing PageImpl straight to
        # JSON exposes Spring Data internals as the API contract, and Spring
        # Data itself declares that shape unstable across versions.
        serialization-mode: via_dto

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    io.github.david7777k.seatflow: DEBUG
